<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏂</text></svg>">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
<title>DBC 教練薪資試算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef4; --line:#d9dfe8; --line-strong:#b9c3d1;
  --ink:#16202b; --ink-2:#4b5866; --muted:#7b8794;
  --accent:#2a6bb0; --accent-ink:#ffffff; --accent-soft:#e3edf8;
  --ok:#1f8a5b; --ok-soft:#dff3e8; --warn:#b8720f; --warn-soft:#fbeed6; --bad:#c0392b; --bad-soft:#f9e1de;
  --seg-base:#5b7a99; --seg-retain:#8bc3a0; --seg-bonus:#2a6bb0;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 8px 24px -12px rgba(22,32,43,.18);
  --radius:10px; --font:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f151d; --surface:#171f2a; --surface-2:#1f2936; --line:#2b3644; --line-strong:#3c4959;
    --ink:#e7edf4; --ink-2:#b4bfcc; --muted:#8593a3;
    --accent:#6ea6e6; --accent-ink:#0f151d; --accent-soft:#1d2f45;
    --ok:#4cc38a; --ok-soft:#173327; --warn:#e0a23a; --warn-soft:#3a2c12; --bad:#e8705f; --bad-soft:#3d1f1b;
    --seg-base:#6d8db0; --seg-retain:#5fae7f; --seg-bonus:#6ea6e6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0f151d; --surface:#171f2a; --surface-2:#1f2936; --line:#2b3644; --line-strong:#3c4959;
  --ink:#e7edf4; --ink-2:#b4bfcc; --muted:#8593a3;
  --accent:#6ea6e6; --accent-ink:#0f151d; --accent-soft:#1d2f45;
  --ok:#4cc38a; --ok-soft:#173327; --warn:#e0a23a; --warn-soft:#3a2c12; --bad:#e8705f; --bad-soft:#3d1f1b;
  --seg-base:#6d8db0; --seg-retain:#5fae7f; --seg-bonus:#6ea6e6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.brand h1{font-size:18px;font-weight:700;letter-spacing:.01em}
.brand .sub{font-size:12px;color:var(--muted);letter-spacing:.04em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px}
.stat .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.stat .val{font-size:22px;font-weight:600;margin-top:2px}
.stat .val small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.cols{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.roster{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column;overflow:hidden}
.roster-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.roster-head h2{font-size:14px;font-weight:600;color:var(--ink-2)}
.roster-list{overflow:auto;padding:6px}
.row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:transparent;width:100%;text-align:left}
.row:hover{background:var(--surface-2)}
.row.active{background:var(--accent-soft)}
.row .idx{font-size:12px;color:var(--muted);text-align:right}
.row .nm{font-weight:500;display:flex;flex-direction:column;line-height:1.2}
.row .nm small{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.near{background:var(--accent-soft);color:var(--accent)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.mobile-nav{display:none;gap:8px;margin-bottom:14px}
.mobile-nav select{flex:1;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);min-width:0}

/* detail */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.who{display:flex;flex-direction:column;gap:4px;margin-right:auto;min-width:0}
.who h2{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who input.name{font-size:22px;font-weight:700;border:0;border-bottom:1px dashed transparent;background:transparent;padding:0;max-width:200px;min-width:60px}
.who input.name:hover,.who input.name:focus{border-bottom-color:var(--line-strong)}
.who input.note{border:0;background:transparent;padding:0;font-size:13px;color:var(--muted);width:100%;max-width:360px}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-weight:500}
.chip select{border:0;background:transparent;font-size:12px;font-weight:500;padding:0}
.fixed{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.field input[type=number]{padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);width:100%;text-align:right}
.field .hint{font-size:11px;color:var(--muted)}
.elig{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.elig .lbl{font-size:12px;color:var(--muted);margin-right:4px}
.tog{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:13px;cursor:pointer;user-select:none}
.tog input{margin:0;accent-color:var(--accent)}
.tog:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.section{padding:18px 20px;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-title h3{font-size:15px;font-weight:600}
.section-title .eq{font-size:13px;color:var(--muted)}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin-bottom:10px}
.bar span{display:block;height:100%;min-width:0}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.legend .it{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend .it b{font-size:15px;color:var(--ink);font-weight:600}
.legend .it i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;font-style:normal}

.months{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mcard{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.mcard-head{padding:10px 12px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:baseline}
.mcard-head b{font-size:15px}
.mcard-head span{font-size:12px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.mrow .t{display:flex;flex-direction:column;line-height:1.2;font-size:13px;min-width:0}
.mrow .t small{font-size:11px;color:var(--muted);margin-top:2px}
.mrow .sub{font-size:12px;color:var(--muted);text-align:right;grid-column:1/-1;margin-top:-4px}
.mrow.flag{background:transparent}
.stepper{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{width:26px;border:0;background:var(--surface-2);font-size:16px;line-height:1;padding:0;color:var(--ink-2)}
.stepper button:hover{background:var(--line)}
.stepper input{width:44px;border:0;text-align:center;padding:6px 0;background:transparent;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.switch{position:relative;width:44px;height:24px;border-radius:999px;background:var(--line-strong);border:0;padding:0;transition:.15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{left:23px}
.divider{padding:6px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);letter-spacing:.04em;background:var(--surface-2)}
.mfoot{margin-top:auto;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface-2);display:grid;gap:4px;font-size:13px}
.mfoot div{display:flex;justify-content:space-between;align-items:center}
.mfoot .k{color:var(--muted)}
.mfoot .big{font-size:16px;font-weight:600}

.total{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.ledger{border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px}
.ledger div{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:12px}
.ledger div:last-child{border-bottom:0}
.ledger .k{color:var(--ink-2)}
.ledger .sum{font-weight:700;font-size:16px}
.verdict{border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;justify-content:center;gap:6px;border:1px solid var(--line)}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)} .verdict.bad{background:var(--bad-soft);border-color:var(--bad)} .verdict.warn{background:var(--warn-soft);border-color:var(--warn)}
.verdict .lbl{font-size:12px;letter-spacing:.06em;color:var(--ink-2)}
.verdict .big{font-size:30px;font-weight:700;line-height:1.1}
.verdict .cmp{font-size:13px;color:var(--ink-2)}
.verdict.ok .big{color:var(--ok)} .verdict.bad .big{color:var(--bad)} .verdict.warn .big{color:var(--warn)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,14,20,.5)}
.dlg-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg-head h2{font-size:16px}
.dlg-body{padding:16px 20px;display:grid;gap:14px;max-height:70vh;overflow:auto}
.dlg-body .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio b{display:block;font-size:14px}
.radio small{color:var(--muted);font-size:12px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.rate-ranks{display:grid;gap:14px}
.rate-ranks h4{margin:0 0 6px;font-size:13px;color:var(--ink-2)}
.help{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.empty{padding:40px;text-align:center;color:var(--muted)}

@media (max-width:1000px){
  .cols{grid-template-columns:1fr}
  .roster{display:none}
  .mobile-nav{display:flex}
  .stats{grid-template-columns:repeat(2,1fr)}
  .months{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .wrap{padding:14px}
  .top-inner{padding:10px 14px}
  .months{grid-template-columns:1fr}
  .fixed{grid-template-columns:1fr 1fr}
  .total{grid-template-columns:1fr}
  .legend{grid-template-columns:repeat(3,1fr)}
  .stat .val{font-size:18px}
  .actions .btn{padding:8px 10px;font-size:13px}
  .panel-head,.section,.fixed{padding-left:14px;padding-right:14px}
  .dlg-body .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.toast,.switch,.switch::after{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>DBC 教練薪資試算</h1>
      <div class="sub">雪季四個月 · 12月 – 3月 · 每月獎金依實際紀錄浮動</div>
    </div>
    <div class="actions">
      <button class="btn primary" id="simAll">全員設為全部達成</button>
      <button class="btn" id="copyAll">複製全員結果</button>
      <button class="btn" id="openSettings">設定</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="mobile-nav">
    <button class="btn" id="prevP" aria-label="上一位">‹</button>
    <select id="pickP" aria-label="選擇人員"></select>
    <button class="btn" id="nextP" aria-label="下一位">›</button>
  </div>
  <div class="cols">
    <aside class="roster">
      <div class="roster-head"><h2>教練名單</h2><button class="btn small" id="addP">＋ 新增</button></div>
      <div class="roster-list" id="roster"></div>
    </aside>
    <section id="detail"></section>
  </div>
</main>

<dialog id="settings">
  <div class="dlg-head"><h2>試算設定</h2><button class="btn small" id="closeSettings">關閉</button></div>
  <div class="dlg-body">
    <div class="grid">
      <div class="field"><label>每月底薪</label><input type="number" id="s_base" inputmode="numeric"></div>
    </div>
    <div id="rateGrid" class="rate-ranks"></div>
    <div>
      <div class="field"><label>實領總薪水的計算方式</label></div>
      <div class="radio">
        <label><input type="radio" name="mode" value="season"><span><b>四個月實領 ＋ 留任加給（建議）</b><small>實領總薪水 ＝ 四個月實領合計（含底薪）＋ 留任加給。全部達成時每月達成項目合計等於每月獎金，實領 ＝ 應領。</small></span></label>
        <label><input type="radio" name="mode" value="sheet"><span><b>依原試算表公式</b><small>實領總薪水 ＝ 四個月實領合計（含底薪）＋ 總實領底薪 118,000。底薪會被計算兩次，留任加給不計入。</small></span></label>
      </div>
    </div>
    <p class="help">所有資料只存在這台裝置的瀏覽器裡，換裝置或清除瀏覽資料後會回到預設值。</p>
  </div>
  <div class="dlg-foot">
    <button class="btn danger" id="resetAll">還原成試算表原始資料</button>
    <button class="btn primary" id="saveSettings">儲存</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
'use strict';
const MONTHS=['12月','1月','2月','3月'];
const SENIOR='資深教練';
// 月發獎金項目（對應試算表 AE 到 CF 欄），每月達成記 1
const ITEMS=[
  {k:'manager',     label:'主管管理無過失',       kind:'flag', elig:p=>!!p.manager,       who:'主管'},
  {k:'snow',        label:'單板lv2 訓練獎金',     kind:'flag', elig:p=>!!p.snow,          who:'單板lv2'},
  {k:'ski',         label:'雙板lv2 訓練獎金',     kind:'flag', elig:p=>!!p.ski,           who:'雙板lv2'},
  {k:'mentor',      label:'資深教練帶新人無重大過失', kind:'flag', elig:p=>p.rank===SENIOR, who:'資深教練'},
  {k:'noComplaint', label:'無客人重大負評',       kind:'flag'},
  {k:'resort',      label:'雪場評級無重大過失',   kind:'flag'}
];
const ITEM=Object.fromEntries(ITEMS.map(t=>[t.k,t]));
const eligible=(t,p)=>!t.elig||t.elig(p);
const CONTRACT='合約教練';
const RATE_RANKS=[SENIOR,CONTRACT];
// 單價依階級設定：同階級同項目同金額。全部達成時，每人每月達成項目合計剛好等於每月獎金
const DEFAULT_SETTINGS={base:29500,mode:'season',
  rates:{
    [SENIOR]:  {manager:5000,snow:10000,ski:30000,mentor:5000,noComplaint:15500,resort:10000},
    [CONTRACT]:{manager:5000,snow:5000, ski:5000, mentor:0,   noComplaint:20500,resort:10000}
  }};
// 規則版本：變更時，舊瀏覽器存的單價會更新為新預設，並把適用的達成項目設為達成
const RULES_VER=7;
// 取得某人某項目的單價（「其他」階級沿用合約教練）
function rateOf(k,p,s){const r=s.rates[p.rank]||s.rates[CONTRACT]||{};return +r[k]||0;}
// 某人全部達成時的每月獎金
function fullMonthly(p,s){let F=0;for(const t of ITEMS) if(eligible(t,p)) F+=rateOf(t.k,p,s);return F;}
const Z=()=>[0,0,0,0], ONE=()=>[1,1,1,1];
function P(id,rank,name,salary,allowance,note,retain,flags,counts){
  const c={}; for(const t of ITEMS) c[t.k]=Z();
  if(counts) Object.assign(c,counts);
  return {id,rank,name,salary,allowance,note,retain,manager:!!flags.manager,snow:!!flags.snow,ski:!!flags.ski,counts:c};
}
const STD={noComplaint:ONE(),resort:ONE()};
const DEFAULT_PEOPLE=[
  P(1,SENIOR,'許佩芸',110000,10000,'單板lv2 / 雙板lv2',80000,{snow:1,ski:1},{snow:ONE(),ski:ONE(),mentor:ONE(),...STD}),
  P(2,SENIOR,'洪琦雅',110000,10000,'單板lv2 / 雙板lv2',80000,{snow:1,ski:1},{snow:ONE(),ski:ONE(),mentor:ONE(),...STD}),

/* ---------- 計算（對應試算表各欄） ---------- */
function calc(p,s){
  const n=MONTHS.length;
  const monthly=(+p.salary||0)+(+p.allowance||0);      // F 月薪
  const expected=monthly*n;                             // H 應領總薪水
  const baseTotal=s.base*n;                             // I 總底薪
  const retain=+p.retain||0;                            // K 留任加給(總)
  const N=(expected-baseTotal-retain)/n;                // L 每月獎金
  const AZ=N+s.base;                                    // CH 每月應領
  const months=MONTHS.map((_,i)=>{
    const subs={}; let v=0;
    for(const t of ITEMS){subs[t.k]=eligible(t,p)?(+p.counts[t.k][i]||0)*rateOf(t.k,p,s):0; v+=subs[t.k];}
    const actual=s.base+v;                              // CI 當月實領 ＝ 底薪 ＋ 當月全部獎金小計
    return {subs,variable:v,actual,diff:actual-AZ};     // CJ +/-
  });
  const sumVar=months.reduce((a,m)=>a+m.variable,0);
  const sumActual=months.reduce((a,m)=>a+m.actual,0);   // CQ
  const totalActual=s.mode==='sheet'?sumActual+baseTotal:sumActual+retain;   // CS
  const targetVar=s.mode==='sheet'?expected-2*baseTotal:expected-baseTotal-retain;
  return {monthly,expected,baseTotal,retain,N,AZ,months,sumVar,sumActual,totalActual,gap:totalActual-expected,targetVar};
}

function refreshNumbers(){
  const p=person(); const s=state.settings; const c=calc(p,s); const el=$('#detail');
  MONTHS.forEach((_,i)=>{
    const mc=c.months[i];
    for(const t of ITEMS){const q=el.querySelector(`[data-sub="${t.k}-${i}"]`); if(q)q.textContent='小計 '+fmt(mc.subs[t.k]);}
    el.querySelector(`[data-mvar="${i}"]`).textContent=fmt(mc.variable);
    el.querySelector(`[data-mact="${i}"]`).textContent=fmt(mc.actual);
    el.querySelector(`[data-mdiff="${i}"]`).innerHTML=gapPill(mc.diff);
  });
  el.querySelector('[data-sumact]').textContent=fmt(c.sumActual);
  el.querySelector('[data-totact]').textContent=fmt(c.totalActual);
  const v=el.querySelector('[data-verdict]');
  v.className='verdict '+(c.gap===0||isNear(p,c)?'ok':c.gap>0?'warn':'bad');
  v.querySelector('.big').textContent=c.gap===0?'剛好相符':sgn(c.gap);
  v.querySelector('.cmp').textContent=verdictText(c,p);
  renderStats();renderRoster();save();
}
function bindDetail(el,p){
  el.querySelectorAll('input[data-k]').forEach(inp=>{
    inp.addEventListener('input',()=>{p.counts[inp.dataset.k][+inp.dataset.i]=Math.max(0,parseInt(inp.value,10)||0);refreshNumbers();});
  });
  el.querySelectorAll('button[data-step]').forEach(b=>{
    b.addEventListener('click',()=>{
      const k=b.dataset.k,i=+b.dataset.i;
      p.counts[k][i]=Math.max(0,(p.counts[k][i]||0)+ +b.dataset.step);
      el.querySelector(`input[data-k="${k}"][data-i="${i}"]`).value=p.counts[k][i];
      refreshNumbers();
    });
  });
  el.querySelectorAll('button[data-flag]').forEach(b=>{
    b.addEventListener('click',()=>{
      const k=b.dataset.flag,i=+b.dataset.i;
      p.counts[k][i]=p.counts[k][i]>0?0:1;
      b.setAttribute('aria-checked',String(p.counts[k][i]>0));
      refreshNumbers();
    });
  });
  el.querySelectorAll('[data-f]').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const f=inp.dataset.f;
      if(['salary','allowance','retain'].includes(f)) p[f]=Math.max(0,parseInt(inp.value,10)||0);
      else if(['manager','snow','ski'].includes(f)){p[f]=inp.checked; setFlags(p);}
      else if(f==='rank'){p[f]=inp.value; setFlags(p);}
      else p[f]=inp.value.trim()||(f==='name'?'未命名':'');
      renderAll();
    });
  });
  $('#simOne').onclick=()=>{simulate(p);renderAll();toast(`${p.name} 已設為全部達成`);};
  $('#clearOne').onclick=()=>{for(const t of ITEMS)p.counts[t.k]=Z();renderAll();};
  $('#delOne').onclick=()=>{
    if(!armed($('#delOne'),'確定刪除？'))return;
    const i=state.people.findIndex(x=>x.id===p.id);
    state.people.splice(i,1);
    state.sel=state.people.length?state.people[Math.min(i,state.people.length-1)].id:0;
    renderAll();
  };
}

// 兩段式確認：第一次按下變成確認文字，3 秒內再按一次才執行
function armed(btn,label){
  if(btn.dataset.armed){clearTimeout(+btn.dataset.armed);delete btn.dataset.armed;btn.textContent=btn.dataset.orig;return true;}
  btn.dataset.orig=btn.textContent;btn.textContent=label;
  btn.dataset.armed=String(setTimeout(()=>{btn.textContent=btn.dataset.orig;delete btn.dataset.armed;},3000));
  return false;
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800);}

renderAll();
</script>
